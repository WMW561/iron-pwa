function restoreProgramExerciseCard(){
  const day = PROGRAM.schedule[programDay];
  if(!day) { restoreExerciseCard(); return; }
  const pgEx = day.exercises[programIdx];
  if(!pgEx) { restoreExerciseCard(); return; }

  const name = W.cur;
  const h = history[name.toLowerCase()];
  const hasHistory = h && h.sets && h.sets.length > 0;
  const total = day.exercises.length;

  document.getElementById('pickerView').style.display='none';
  const card = document.getElementById('exCard');
  card.style.display='block';
  document.getElementById('exName').innerHTML = `<span style="color:var(--muted);font-size:12px;font-weight:600">${programIdx+1}/${total}</span> ${name}`;

  let lastInfo = 'First time';
  if(hasHistory && h.allSets){
    lastInfo = `Last: ${h.allSets.map(s=>s.weight+'×'+s.reps).join(', ')} (${h.date})`;
  } else if(hasHistory){
    lastInfo = `Last: ${h.desc} × ${h.sets.join(', ')} (${h.date})`;
  }
  document.getElementById('exLast').innerHTML = `
    <div style="margin-bottom:6px">${lastInfo}</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:4px">
      <span style="background:var(--s2);padding:2px 8px;border-radius:6px;font-size:11px;color:var(--text);font-style:normal;font-weight:600">Rx: ${pgEx.sets}×${pgEx.reps}</span>
      <span style="background:var(--s2);padding:2px 8px;border-radius:6px;font-size:11px;color:var(--yellow);font-style:normal">Tempo: ${pgEx.tempo}</span>
      <span style="background:var(--s2);padding:2px 8px;border-radius:6px;font-size:11px;color:var(--blue);font-style:normal">Rest: ${pgEx.rest>=120?pgEx.rest/60+'min':pgEx.rest+'s'}</span>
    </div>
    <div style="font-size:11px;color:var(--dim);font-style:normal">${pgEx.cue}</div>`;

  restDuration = pgEx.rest;

  // Rebuild set rows preserving logged state, smart pre-fill from per-set history
  const container = document.getElementById('setRows');
  container.innerHTML='';
  const lastAllSets = hasHistory && h.allSets ? h.allSets : null;

  for(let i=0;i<W.targetSets;i++){
    const row = document.createElement('div');
    row.className = 'set-row';
    row.id = 'setRow'+i;
    const isLogged = i < W.sets.length;

    if(isLogged){
      row.classList.add('done');
      row.innerHTML=`
        <span class="set-label done-label" id="sLbl${i}">✓ Set ${i+1}</span>
        <input class="w-input" id="sW${i}" type="number" inputmode="decimal" value="${W.sets[i].weight}" readonly style="opacity:.5">
        <span class="x-label">×</span>
        <input class="r-input" id="sR${i}" type="number" inputmode="numeric" value="${W.sets[i].reps}" readonly style="opacity:.5">
        <button class="set-check checked" id="sC${i}" onclick="logSet(${i})">✓</button>
        <button style="width:28px;height:28px;border-radius:6px;background:none;border:1px solid var(--border);color:var(--muted);font-size:12px;display:flex;align-items:center;justify-content:center" onclick="deleteSet(${i})">×</button>`;
    } else {
      if(i === W.setIdx) row.classList.add('current');
      let sugW = '';
      let sugR = '';
      if(lastAllSets && lastAllSets[i]){
        sugW = lastAllSets[i].weight;
        sugR = lastAllSets[i].reps;
      } else if(lastAllSets && lastAllSets.length > 0){
        sugW = lastAllSets[lastAllSets.length-1].weight;
      } else if(hasHistory){
        sugW = h.weight;
        sugR = h.sets && h.sets[i] ? h.sets[i] : '';
      }
      row.innerHTML=`
        <span class="set-label" id="sLbl${i}">Set ${i+1}</span>
        <input class="w-input" id="sW${i}" type="number" inputmode="decimal" placeholder="lbs" value="${sugW}" onfocus="this.select()">
        <span class="x-label">×</span>
        <input class="r-input" id="sR${i}" type="number" inputmode="numeric" placeholder="reps" value="${sugR}" onfocus="this.select()">
        <button class="set-check" id="sC${i}" onclick="logSet(${i})">✓</button>
        <button style="width:28px;height:28px;border-radius:6px;background:none;border:1px solid var(--border);color:var(--muted);font-size:12px;display:flex;align-items:center;justify-content:center" onclick="deleteSet(${i})">×</button>`;
    }
    container.appendChild(row);
  }
}

// Rebuild exercise card from saved state WITHOUT resetting W.sets/setIdx
function restoreExerciseCard(){
  const name = W.cur;
  const h = history[name.toLowerCase()];
  const hasHistory = h && h.sets && h.sets.length > 0;

  document.getElementById('pickerView').style.display='none';
  const card = document.getElementById('exCard');
  card.style.display='block';
  document.getElementById('exName').textContent = name;
  document.getElementById('exLast').textContent = hasHistory ?
    'Last: '+h.desc+' × '+h.sets.join(', ')+' ('+h.date+')' : 'First time';

  const container = document.getElementById('setRows');
  container.innerHTML='';
  for(let i=0;i<W.targetSets;i++){
    const row = document.createElement('div');
    row.className = 'set-row';
    row.id = 'setRow'+i;
    const isLogged = i < W.sets.length;

    if(isLogged){
      row.classList.add('done');
      row.innerHTML=`
        <span class="set-label done-label" id="sLbl${i}">✓ Set ${i+1}</span>
        <input class="w-input" id="sW${i}" type="number" inputmode="decimal" value="${W.sets[i].weight}" readonly style="opacity:.5">
        <span class="x-label">×</span>
        <input class="r-input" id="sR${i}" type="number" inputmode="numeric" value="${W.sets[i].reps}" readonly style="opacity:.5">
        <button class="set-check checked" id="sC${i}" onclick="logSet(${i})">✓</button>
        <button style="width:28px;height:28px;border-radius:6px;background:none;border:1px solid var(--border);color:var(--muted);font-size:12px;display:flex;align-items:center;justify-content:center" onclick="deleteSet(${i})">×</button>`;
    } else {
      if(i === W.setIdx) row.classList.add('current');
      const sugW = hasHistory ? h.weight : (W.sets.length>0 ? W.sets[W.sets.length-1].weight : '');
      const sugR = hasHistory && h.sets[i] ? h.sets[i] : '';
      row.innerHTML=`
        <span class="set-label" id="sLbl${i}">Set ${i+1}</span>
        <input class="w-input" id="sW${i}" type="number" inputmode="decimal" placeholder="lbs" value="${sugW}" onfocus="this.select()">
        <span class="x-label">×</span>
        <input class="r-input" id="sR${i}" type="number" inputmode="numeric" placeholder="reps" value="${sugR}" onfocus="this.select()">
        <button class="set-check" id="sC${i}" onclick="logSet(${i})">✓</button>
        <button style="width:28px;height:28px;border-radius:6px;background:none;border:1px solid var(--border);color:var(--muted);font-size:12px;display:flex;align-items:center;justify-content:center" onclick="deleteSet(${i})">×</button>`;
    }
    container.appendChild(row);
  }
}

// ===================== iOS AUDIO CONTEXT INIT =====================
// iOS requires user gesture to init AudioContext — do it on first tap
let audioCtxReady = false;
document.addEventListener('touchstart', function initAudio(){
  if(audioCtxReady) return;
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const osc=ctx.createOscillator();
    osc.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime+0.001); // silent init
    audioCtxReady=true;
  }catch(e){}
}, {once:true});

// ===================== SERVICE WORKER =====================
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');

// ===================== SUPABASE CLIENT BADGE (v0.3) =====================
// Init sync pill with current queue state on load, then flush any queued items.
updateSyncPill();
initClientSyncBadge().then(() => flushQueue());
</script>
