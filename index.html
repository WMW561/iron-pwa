<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a0a">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Iron</title>
<!-- Supabase JS UMD — kept for any future read-only public surfaces (v0.3 writes route through pwa-sync Edge Function) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!-- Brand pivot 2026-05-06: Plus Jakarta Sans (display) + DM Sans (body) — Google Fonts, zero licensing cost -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Brand pivot 2026-05-06: Plus Jakarta Sans (display) + DM Sans (body) replace Inter.
   Google Fonts loaded via <link> tags in <head> (preconnect + stylesheet). */
/* TODO(rename): --red should be renamed --accent or --brand-primary in a future cleanup pass.
   It is intentionally kept as --red here to minimize blast radius during the 2026-05-06 brand pivot.
   applyBrand() writes to --red at runtime for per-trainer overrides — rename must update both CSS
   and the applyBrand() JS call simultaneously. */
/* CONTRAST NOTE: --red (now #1C5F72) used as text color on dark bg (#0a0a0a) in .hdr h1 yields
   ~1.2:1 contrast ratio — fails WCAG AA. The wordmark is the primary affected element. Recommended
   fix (deferred, design decision): either render "IRON" wordmark in #fff on the dark header, or
   lighten the house-default text variant to #5BBDD1 (~4.5:1 on dark). Per-trainer overrides via
   applyBrand() may also produce low-contrast results depending on trainer brand color — not engineered
   to clamp; limitation documented here. */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  /* Brand pivot 2026-05-06: deep teal-slate replaces red. Variable name kept for override compat. */
  --red:#1C5F72;--red-glow:rgba(28,95,114,.25);--red-dark:#154d5e;
  --bg:#0a0a0a;--s1:#141414;--s2:#1c1c1c;--s3:#242424;
  --border:#2a2a2a;--border-light:#333;
  --text:#f5f5f5;--dim:#999;--muted:#666;
  --green:#22c55e;--green-bg:rgba(34,197,94,.1);
  --yellow:#eab308;--blue:#3b82f6;
  --safe-b:env(safe-area-inset-bottom)
}
body{font-family:'DM Sans',-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;padding-bottom:calc(80px + var(--safe-b));overflow-x:hidden}
button{font-family:inherit;cursor:pointer;border:none;outline:none}
input{font-family:inherit;outline:none}
h1,h2,h3{font-family:'Plus Jakarta Sans',sans-serif}
h1{font-weight:800}
h2{font-weight:700}
h3{font-weight:700}

/* Header */
.hdr{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--border)}
/* Wordmark uses warm off-white per brand spec (Brittany 2026-05-06): teal-slate fails AA contrast on dark bg */
.hdr h1{font-size:22px;font-weight:800;color:#fafafa;letter-spacing:-.5px;font-family:'Plus Jakarta Sans',sans-serif}
.hdr .rt{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--dim)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* Brand logo in header */
.hdr-logo{max-height:28px;width:auto;display:block;border-radius:4px}

/* Sync queue status pill */
.sync-pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:2px 7px;border-radius:10px;border:1px solid transparent;white-space:nowrap}
.sync-pill.ok{color:var(--green);border-color:rgba(34,197,94,.3);background:rgba(34,197,94,.08)}
.sync-pill.pending{color:var(--yellow);border-color:rgba(234,179,8,.3);background:rgba(234,179,8,.08)}
.sync-pill.error{color:#f87171;border-color:rgba(248,113,113,.3);background:rgba(248,113,113,.08)}
.sync-pill-dot{width:6px;height:6px;border-radius:50%;background:currentColor}

/* Recovery */
.recov{display:none;padding:10px 16px;background:var(--s1);border-bottom:1px solid var(--border);font-size:12px;color:var(--dim);justify-content:space-between}
.recov.show{display:flex}
.recov .g{color:var(--green);font-weight:700}

/* Exercise Picker (Start State) */
.picker{padding:16px}
.picker-title{font-size:14px;color:var(--dim);margin-bottom:10px}
.recent-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.recent-btn{padding:8px 14px;border-radius:20px;background:var(--s2);border:1px solid var(--border);color:var(--text);font-size:13px;font-weight:500}
.recent-btn:active{background:var(--s3);border-color:var(--red)}
.add-row{display:flex;gap:8px}
.add-input{flex:1;height:44px;border-radius:12px;background:var(--s1);border:1px solid var(--border);color:var(--text);font-size:15px;padding:0 14px}
.add-input:focus{border-color:var(--red)}
.add-input::placeholder{color:var(--muted)}
.add-btn{width:44px;height:44px;border-radius:12px;background:var(--red);color:#fff;font-size:20px;font-weight:700}

/* Active Exercise Card */
.ex-card{display:none;padding:16px}
.ex-name{font-size:20px;font-weight:700;margin-bottom:2px}
.ex-last{font-size:12px;color:var(--muted);margin-bottom:12px;font-style:italic}

/* Set Rows */
.set-row{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--border)}
.set-row.done{opacity:.6}
.set-row.current{background:var(--s1);margin:0 -16px;padding:10px 16px;border-radius:12px;border:1px solid var(--red);opacity:1}
.set-label{width:48px;font-size:11px;color:var(--muted);text-transform:uppercase;font-weight:600}
.set-label.done-label{color:var(--green)}
.w-input,.r-input{width:72px;height:40px;border-radius:10px;background:var(--s2);border:1px solid var(--border);color:var(--text);font-size:17px;font-weight:600;text-align:center;-webkit-appearance:none}
.w-input:focus,.r-input:focus{border-color:var(--red);background:var(--s3)}
.x-label{font-size:15px;color:var(--muted);font-weight:600}
.set-check{width:40px;height:40px;border-radius:10px;background:var(--s2);border:1px solid var(--border);color:var(--muted);font-size:18px;display:flex;align-items:center;justify-content:center}
.set-check.checked{background:var(--green-bg);border-color:var(--green);color:var(--green)}
.set-type{font-size:10px;color:var(--muted);padding:2px 6px;border-radius:4px;border:1px solid var(--border);margin-left:auto}
.set-type.warmup{color:var(--yellow);border-color:var(--yellow)}
.set-type.failure{color:var(--red);border-color:var(--red)}

/* Add set + actions */
.ex-actions{display:flex;gap:8px;padding:12px 0}
.act-btn{flex:1;height:38px;border-radius:10px;background:var(--s1);border:1px solid var(--border);color:var(--dim);font-size:12px;font-weight:600}
.act-btn:active{background:var(--s2)}
.act-btn.primary{border-color:var(--green);color:var(--green)}

/* Rest Timer — see fixed-position version below */
.rest-time{font-size:28px;font-weight:900;color:var(--text);font-variant-numeric:tabular-nums}
.rest-label{font-size:11px;color:var(--muted);margin-top:2px}

/* Workout Log (completed exercises) */
.log{padding:0 16px}
.log h3{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);padding:12px 0 6px}
.log-item{display:flex;flex-direction:column;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;cursor:pointer}
.log-name{font-weight:600}
.log-sets{color:var(--dim)}
.log-actions{display:none;gap:8px;margin-top:6px}
.log-item.expanded .log-actions{display:flex}
.log-act{padding:6px 12px;border-radius:8px;font-size:11px;font-weight:600}
.log-act.edit{background:var(--s2);border:1px solid var(--blue);color:var(--blue)}
.log-act.del{background:var(--s2);border:1px solid var(--red);color:var(--red)}

/* Edit modal */
.edit-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:95;overflow-y:auto;padding:20px}
.edit-modal.show{display:flex;align-items:flex-start;justify-content:center}
.edit-box{background:var(--s1);border:1px solid var(--border);border-radius:20px;padding:20px;width:100%;max-width:400px;margin-top:30px}
.edit-box h3{font-size:16px;font-weight:700;margin-bottom:14px}
.edit-set-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border)}
.edit-set-row span{font-size:12px;color:var(--muted);width:40px}
.edit-set-row input{width:70px;height:36px;border-radius:8px;background:var(--s2);border:1px solid var(--border);color:var(--text);font-size:15px;font-weight:600;text-align:center}
.edit-set-row input:focus{border-color:var(--red)}
.edit-set-row .x-label{font-size:14px;color:var(--muted)}
.edit-btns{display:flex;gap:8px;margin-top:14px}
.edit-btns button{flex:1;height:42px;border-radius:10px;font-size:13px;font-weight:700}
.edit-save{background:var(--green-bg);border:1px solid var(--green);color:var(--green)}
.edit-cancel{background:var(--s2);border:1px solid var(--border);color:var(--dim)}

/* Recent exercise delete */
.recent-btn{position:relative}
.recent-del{display:none;position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:var(--red);color:#fff;font-size:12px;line-height:20px;text-align:center}
.picker.edit-mode .recent-del{display:block}

/* Bottom Bar */
.bottom{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:1px solid var(--border);padding:12px 16px calc(12px + var(--safe-b));display:flex;gap:8px}
.bot-btn{flex:1;height:50px;border-radius:14px;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px}
.bot-btn.next{background:var(--s1);border:1px solid var(--blue);color:var(--blue)}
.bot-btn.finish{background:var(--s1);border:1px solid var(--green);color:var(--green)}
.bot-btn.start{background:var(--red);color:#fff;border:none;width:100%}
.bot-btn:active{transform:scale(.97)}

/* Modal */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:100;overflow-y:auto;padding:20px}
.modal-bg.show{display:flex;align-items:flex-start;justify-content:center}
.modal{background:var(--s1);border:1px solid var(--border);border-radius:20px;padding:24px;width:100%;max-width:400px;margin-top:30px}
.modal h2{font-size:18px;font-weight:900;color:var(--red);margin-bottom:16px}
.modal .row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border);font-size:13px}
.modal .lbl{color:var(--dim)}.modal .val{font-weight:600}
.modal .close{width:100%;height:48px;border-radius:12px;background:var(--red);color:#fff;font-size:15px;font-weight:700;margin-top:16px}

/* Voice overlay removed — iOS PWA blocks Web Speech API */

/* Custom Dialog */
.dialog-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:200;align-items:center;justify-content:center;padding:20px}
.dialog-bg.show{display:flex}
.dialog-box{background:var(--s1);border:1px solid var(--border);border-radius:16px;padding:20px;width:100%;max-width:320px;text-align:center}
.dialog-box .msg{font-size:15px;color:var(--text);margin-bottom:16px;line-height:1.4}
.dialog-btns{display:flex;gap:8px}
.dialog-btns button{flex:1;height:44px;border-radius:10px;font-size:14px;font-weight:700}
.dialog-cancel{background:var(--s2);border:1px solid var(--border);color:var(--dim)}
.dialog-ok{background:var(--red);border:none;color:#fff}
.dialog-ok.green{background:var(--green-bg);border:1px solid var(--green);color:var(--green)}

/* Muscle Group Prompt */
.group-prompt{display:none;padding:12px 16px;background:var(--s1);border-bottom:1px solid var(--border)}
.group-prompt.show{display:block}
.group-prompt .label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
.group-prompt .pills{display:flex;flex-wrap:wrap;gap:6px}
.group-prompt .pill{padding:6px 12px;border-radius:16px;background:var(--s2);border:1px solid var(--border);color:var(--dim);font-size:12px;font-weight:600}
.group-prompt .pill:active{border-color:var(--red);color:var(--text)}

/* Weekly Stats */
.week-stats{padding:8px 16px;font-size:12px;color:var(--dim);text-align:center;border-bottom:1px solid var(--border)}
.week-stats .num{color:var(--text);font-weight:700}

/* Rest Timer — fixed position above bottom bar */
.rest-bar{display:none;position:fixed;bottom:calc(62px + var(--safe-b));left:0;right:0;z-index:50;padding:10px 16px;background:var(--s1);border-top:1px solid var(--border);text-align:center}
.rest-bar.show{display:block}

/* Dashboard */
.dash{padding:16px;padding-bottom:calc(80px + var(--safe-b));overflow-y:auto;-webkit-overflow-scrolling:touch}
.dash-back{background:none;color:var(--dim);font-size:13px;font-weight:600;padding:0;margin-bottom:16px}
.dash-back:active{color:var(--text)}
.dash-title{font-size:18px;font-weight:800;color:var(--text);margin-bottom:16px}
.dash-card{background:var(--s1);border:1px solid var(--border);border-radius:20px;padding:16px;margin-bottom:12px}
.dash-card-title{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:12px}
.dash-row{display:flex;gap:12px}
.dash-row .dash-card{flex:1}
.dash-stat{font-size:28px;font-weight:900;color:var(--text);line-height:1}
.dash-stat-label{font-size:11px;color:var(--dim);margin-top:4px}
.dash-delta{font-size:11px;font-weight:700;margin-top:4px}
.dash-delta.up{color:var(--green)}
.dash-delta.down{color:var(--red)}
.dash-delta.flat{color:var(--dim)}
.dash-empty{text-align:center;color:var(--dim);font-size:14px;padding:40px 16px}
.dash-section{margin-top:20px}
.dash-section-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.dash-section-title{font-size:13px;font-weight:700;color:var(--text);text-transform:uppercase;letter-spacing:0.5px}
.dash-add-btn{background:none;color:var(--red);font-size:12px;font-weight:700;padding:4px 10px;border:1px solid var(--red);border-radius:12px}
.dash-add-btn:active{background:var(--red);color:#fff}
.dash-ex-card{background:var(--s1);border:1px solid var(--border);border-radius:16px;padding:12px 14px;margin-bottom:8px}
.dash-ex-name{font-size:13px;font-weight:700;color:var(--text)}
.dash-ex-sub{font-size:11px;color:var(--dim);margin-top:2px}
.lab-pill{display:inline-block;padding:6px 12px;border-radius:16px;background:var(--s2);border:1px solid var(--border);color:var(--dim);font-size:12px;font-weight:600;margin:0 4px 6px 0}
.lab-pill:active,.lab-pill.sel{border-color:var(--red);color:var(--text);background:var(--red-dark)}
.lab-entry{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)}
.lab-entry:last-child{border-bottom:none}
.lab-val{font-size:16px;font-weight:800;color:var(--text)}
.lab-unit{font-size:11px;color:var(--dim);margin-left:2px}
.lab-date{font-size:11px;color:var(--muted)}
.lab-del{background:none;color:var(--red);font-size:11px;font-weight:700;padding:2px 6px;border:1px solid var(--red);border-radius:8px;margin-left:8px}
.dash-detail-back{background:none;color:var(--dim);font-size:13px;font-weight:600;padding:0;margin-bottom:12px}
.dash-detail-back:active{color:var(--text)}
/* View transitions */
.dash{opacity:1;transition:opacity 0.15s ease}
.dash-card{animation:dashFadeIn 0.2s ease both}
@keyframes dashFadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>

<div class="hdr">
  <h1>IRON</h1>
  <div class="rt">
    <button id="navProtein" style="background:none;color:var(--dim);font-size:12px;font-weight:600;padding:4px 8px;border:1px solid var(--border);border-radius:6px" onclick="showDashboard()">Protein</button>
    <button style="background:none;color:var(--dim);font-size:12px;font-weight:600;padding:4px 8px;border:1px solid var(--border);border-radius:6px" onclick="showHistory()">History</button>
    <span class="dot"></span><span id="timer">00:00</span>
  </div>
</div>

<!-- Recovery banner — hidden until Whoop API is connected -->
<div class="recov" id="recov"><span>Recovery</span><span class="g" id="recovScore"></span></div>

<div class="rest-bar" id="restBar" onclick="cycleRestTime()">
  <div class="rest-time" id="restTime">1:30</div>
  <div class="rest-label">REST (tap to change)</div>
</div>

<!-- Weekly Stats Banner -->
<div class="week-stats" id="weekStats" style="display:none"></div>

<!-- Dashboard View -->
<div id="dashView" class="dash" style="display:none"></div>

<!-- Workout Focus Selector -->
<div id="planView" class="picker">
  <div class="picker-title">WHAT ARE YOU HITTING TODAY?</div>
  <div id="planGrid" style="display:flex;flex-direction:column;gap:8px;margin-bottom:16px"></div>
  <button style="width:100%;height:40px;border-radius:10px;background:var(--s2);border:1px solid var(--border);color:var(--dim);font-size:12px;font-weight:600" onclick="skipPlan()">Free Workout</button>
</div>

<!-- Exercise picker (shown when no active exercise) -->
<div id="pickerView" class="picker" style="display:none">
  <div style="display:flex;justify-content:space-between;align-items:center">
  <div class="picker-title">RECENT EXERCISES</div>
  <button style="font-size:11px;color:var(--muted);background:none;padding:4px 8px" onclick="toggleEditRecent()" id="editRecentBtn">Edit</button>
</div>
  <div class="recent-grid" id="recentGrid"></div>
  <div class="picker-title" style="margin-top:8px">ADD EXERCISE</div>
  <div class="add-row">
    <input class="add-input" id="exInput" placeholder="Exercise name..." enterkeyhint="next">
    <button class="add-btn" id="exAddBtn">+</button>
  </div>
</div>

<!-- Program Overview (shown before starting exercises) -->
<div id="programOverview" class="picker" style="display:none">
  <div id="overviewContent"></div>
</div>

<!-- Active exercise (shown when logging) -->
<div id="exCard" class="ex-card">
  <div class="ex-name" id="exName"></div>
  <div class="ex-last" id="exLast"></div>
  <div id="setRows"></div>
  <div class="ex-actions">
    <button class="act-btn" onclick="addSetRow()">+ Set</button>
    <button class="act-btn" onclick="toggleType()">Type</button>
    <button class="act-btn primary" onclick="finishExercise()">Next Exercise</button>
  </div>
</div>

<!-- Completed exercises log -->
<div class="log" id="logView"></div>

<!-- Bottom bar -->
<div class="bottom" id="bottomBar"></div>

<!-- Workout History Panel -->
<div class="modal-bg" id="historyModal">
  <div class="modal" style="max-height:80vh;overflow-y:auto">
    <h2 style="color:var(--blue)">WORKOUT HISTORY</h2>
    <div id="historyBody"></div>
    <button class="close" style="background:var(--s2);color:var(--dim);border:1px solid var(--border)" onclick="document.getElementById('historyModal').classList.remove('show')">Close</button>
    <button style="width:100%;height:38px;border-radius:10px;background:var(--s2);border:1px solid var(--border);color:var(--muted);font-size:12px;font-weight:600;margin-top:8px" onclick="exportData()">Export All Data</button>
  </div>
</div>

<!-- Summary modal -->
<div class="modal-bg" id="summaryModal">
  <div class="modal">
    <h2>WORKOUT SUMMARY</h2>
    <div id="summaryBody"></div>
    <button class="close" onclick="closeSummary()">DONE</button>
    <!-- Stopgap trainer contact: opens native mail composer. v0.4 TODO: replace with in-app messages table + Edge Function action + portal inbox. -->
    <button id="msgTrainerBtn" style="width:100%;height:40px;border-radius:10px;background:var(--s2);border:1px solid var(--border);color:var(--dim);font-size:12px;font-weight:600;margin-top:8px" onclick="messageTrainer()">Message your trainer</button>
    <button style="width:100%;height:40px;border-radius:10px;background:var(--s2);border:1px solid var(--border);color:var(--muted);font-size:11px;font-weight:600;margin-top:8px" onclick="exportData()">Export All Data (JSON)</button>
  </div>
</div>

<!-- Edit exercise modal -->
<div class="edit-modal" id="editModal">
  <div class="edit-box">
    <h3 id="editTitle">Edit Exercise</h3>
    <div id="editSets"></div>
    <div class="edit-btns">
      <button class="edit-cancel" onclick="closeEdit()">Cancel</button>
      <button class="edit-save" onclick="saveEdit()">Save</button>
    </div>
  </div>
</div>

<!-- Voice overlay removed — iOS PWA blocks Web Speech API. Using speed-first manual input instead. -->

<!-- Custom Dialog Modal -->
<div class="dialog-bg" id="dialogModal">
  <div class="dialog-box">
    <div class="msg" id="dialogMsg"></div>
    <div id="dialogInput" style="display:none;margin-bottom:12px">
      <input type="text" id="dialogInputField" style="width:100%;height:40px;border-radius:10px;background:var(--s2);border:1px solid var(--border);color:var(--text);font-size:15px;padding:0 14px;text-align:center">
    </div>
    <div class="dialog-btns">
      <button class="dialog-cancel" id="dialogCancel" onclick="resolveDialog(false)">Cancel</button>
      <button class="dialog-ok" id="dialogOk" onclick="resolveDialog(true)">OK</button>
    </div>
  </div>
</div>

<!-- Muscle Group Prompt (Free Workout) -->
<div class="group-prompt" id="groupPrompt">

// Single client → server call. Throws on transport failure; returns parsed JSON otherwise.
// ===================== SYNC QUEUE (offline-tolerant) =====================
// Queue entry: { id, action, payload, attempts, ts }
// All pwa-sync writes (start_session, complete_session) go through enqueueSync.
// resolve_token is read-only and bypasses the queue.

const SYNC_QUEUE_KEY = 'iron_sync_queue';
let _flushInProgress = false;

function _loadQueue(){ try{ return JSON.parse(localStorage.getItem(SYNC_QUEUE_KEY)) || []; }catch(e){ return []; } }
function _saveQueue(q){ localStorage.setItem(SYNC_QUEUE_KEY, JSON.stringify(q)); }

function _syncPillEl(){
  let el = document.getElementById('syncPill');
  if(!el){
    el = document.createElement('span');
    el.id = 'syncPill';
    el.className = 'sync-pill ok';
    el.innerHTML = '<span class="sync-pill-dot"></span><span id="syncPillText">Synced</span>';
    const rt = document.querySelector('.hdr .rt');
    if(rt) rt.insertBefore(el, rt.firstChild);
  }
  return el;
}

function updateSyncPill(){
  const q = _loadQueue();
  const pill = _syncPillEl();
  const txt = document.getElementById('syncPillText');
  const hasError = q.some(e => e.attempts >= 3);
  if(q.length === 0){
    pill.className = 'sync-pill ok';
    if(txt) txt.textContent = 'Synced';
  } else if(hasError){
    pill.className = 'sync-pill error';
    if(txt) txt.textContent = q.length + ' failed';
  } else {
    pill.className = 'sync-pill pending';
    if(txt) txt.textContent = q.length + ' pending';
  }
}

async function flushQueue(){
  if(_flushInProgress || !window.IRON_TOKEN) return;
  _flushInProgress = true;
  try {
    const q = _loadQueue();
    if(q.length === 0){ return; }
    // Process in insertion order; stop on first failure.
    // Skip complete_session entries that are still waiting on a start_session to drain.
    for(let i = 0; i < q.length; i++){
      const entry = q[i];
      if(entry._awaitingSessionId) break; // can't proceed without the real session_id
      try {
        const result = await _rawPwaSync(entry.action, entry.payload);
        // On start_session success, patch any pending complete_session with the real session_id
        if(entry.action === 'start_session' && result && result.session_id){
          localStorage.setItem('iron_session_id', result.session_id);
          // Update queued complete_session entries that used a placeholder id
          for(let j = i+1; j < q.length; j++){
            if(q[j].action === 'complete_session' && q[j]._awaitingSessionId === entry.id){
              q[j].payload.session_id = result.session_id;
              delete q[j]._awaitingSessionId;
            }
          }
        }
        // On complete_session success, clean up the session id
        if(entry.action === 'complete_session'){
          localStorage.removeItem('iron_session_id');
        }
        q.splice(i, 1);
        i--;
        _saveQueue(q);
      } catch(e){
        q[i].attempts = (q[i].attempts || 0) + 1;
        _saveQueue(q);
        console.warn('[Iron] flushQueue: action=' + entry.action + ' attempt=' + q[i].attempts, e);
        break; // stop on first failure
      }
    }
  } finally {
    _flushInProgress = false;
    updateSyncPill();
  }
}

function enqueueSync(action, payload){
  const q = _loadQueue();
  const entry = {
    id: Date.now() + '_' + Math.random().toString(36).slice(2,7),
    action,
    payload: payload || {},
    attempts: 0,
    ts: new Date().toISOString()
  };
  // If queueing a complete_session and its start_session is still pending, mark the dependency
  if(action === 'complete_session'){
    const pendingStart = q.find(e => e.action === 'start_session');
    if(pendingStart) entry._awaitingSessionId = pendingStart.id;
  }
  q.push(entry);
  _saveQueue(q);
  updateSyncPill();
  return entry.id;
}

// Raw network call (no queue logic) — used by flushQueue and resolve_token
async function _rawPwaSync(action, payload){
  if(!window.IRON_TOKEN) throw new Error('no_token');
  const res = await fetch(PWA_SYNC_URL, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + SUPABASE_ANON_KEY
    },
    body: JSON.stringify({ token: window.IRON_TOKEN, action, payload })
  });
  const data = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data.error || ('http_' + res.status));
  return data;
}

// Public pwaSync: resolve_token bypasses queue (read-only); writes go through queue
async function pwaSync(action, payload){
  if(action === 'resolve_token'){
    return _rawPwaSync(action, payload);
  }
  // Enqueue and immediately attempt flush
  enqueueSync(action, payload);
  await flushQueue();
  // Return a minimal stub so callers that check data.session_id still work
  // (start_session callers read iron_session_id from localStorage after flush)
  return {};
}

// ===================== PLATE MATH =====================
function calcWeight(s){
  s = s.trim().toLowerCase();
  // Direct number
  let m = s.match(/^(\d+\.?\d*)\s*(lbs?|pounds?)?$/);
  if(m) return {total:parseFloat(m[1]), desc:m[1]+' lbs'};
  // Dumbbell
  m = s.match(/(\d+\.?\d*)\s*(lb|pound)?\s*(dumbbe?lls?|dbs?)/);
  if(m) return {total:parseFloat(m[1]), desc:m[1]+' lb DBs', db:true};
  // Plate math
  const nums={a:1,one:1,two:2,three:3,four:4,five:5,six:6};
  const names={plate:45,quarter:25,dime:10,nickel:5};
  let per=0, found=false;
  const re=/(\w+)\s+(45|35|25|10|5|2\.5)s?|(\w+)\s+(plates?|quarters?|dimes?|nickels?)/gi;
  let x;
  while((x=re.exec(s))!==null){
    found=true;
    if(x[1]&&x[2]){per+=(nums[x[1]]||parseInt(x[1])||1)*parseFloat(x[2])}
    else if(x[3]&&x[4]){per+=(nums[x[3]]||parseInt(x[3])||1)*(names[x[4].replace(/s$/,'')]||0)}
  }
  if(found&&per>0){const t=45+per*2;return{total:t,desc:t+' lbs ('+s+')'}}
  if(s.includes('bar')||s==='bar')return{total:45,desc:'45 lbs (bar)'};
  return null;
}

// ===================== WORKOUT LIFECYCLE =====================
function startWorkout(){
  W.active=true; W.start=new Date(); W.exercises=[]; W.cur=null; W.sets=[]; W.setIdx=0;
  save(); startTimer();
  updateBottomBar();
  // Edge Function write: start_session. Fire-and-forget, failsafe.
  (async function(){
    if(!window.IRON_TOKEN) return;
    try {
      const data = await pwaSync('start_session', {
        is_free_workout: true,
        started_at: W.start.toISOString()
      });
      if(data && data.session_id) localStorage.setItem('iron_session_id', data.session_id);
    } catch(e){ console.warn('[Iron] start_session failed', e); }
  })();
}

function updateBottomBar(){

      <button class="bot-btn finish" onclick="endWorkout()" style="flex:1"><span style="font-size:11px;color:var(--dim);margin-right:4px">${done}/${total}</span> Finish</button>
      <button style="position:absolute;top:-30px;left:16px;font-size:11px;color:var(--muted);background:none" onclick="goHome()">✕ Home</button>

  } else {

      <button class="bot-btn finish" onclick="endWorkout()">Finish</button>

      <button style="position:absolute;top:-30px;right:16px;font-size:11px;color:var(--muted);background:none" onclick="discardWorkout()">Discard</button>`;
  }

async function goHome(){
  if(W.active && (W.exercises.length > 0 || (W.cur && W.sets.length > 0))){
    const ok = await showDialog('Go home? Your workout will be saved and you can resume later.', {okText:'Go Home', green:true});
    if(!ok) return;
  }
  // Finalize current exercise if it has logged sets (prevents silent corruption on next select)
  if(W.cur && W.sets.length > 0){
    finishExercise();
  } else if(W.cur){
    W.cur=null; W.sets=[]; W.setIdx=0;
  }
  // Preserve program state in W before showPlanView clears the in-memory vars
  if(programDay){ W.programDay=programDay; W.programIdx=programIdx; }
  save();
  // Reset UI to plan view
  document.getElementById('exCard').style.display='none';
  document.getElementById('pickerView').style.display='none';
  document.getElementById('groupPrompt').classList.remove('show');
  clearRest();
  // If no exercises logged, fully discard
  if(W.exercises.length === 0){
    localStorage.removeItem('iron_active');
    W={active:false,start:null,exercises:[],cur:null,sets:[],setIdx:0,targetSets:3};
    programDay=null; programQueue=[]; programIdx=0;
    if(timerInt)clearInterval(timerInt);
    document.getElementById('timer').textContent='00:00';
    document.getElementById('logView').innerHTML='';
    document.getElementById('bottomBar').innerHTML='';
  }
  showPlanView();
}

function skipProgramExercise(){
  // Skip current exercise without logging
  if(!programDay) return;
  W.cur=null; W.sets=[]; W.setIdx=0;
  document.getElementById('exCard').style.display='none';
  const day = PROGRAM.schedule[programDay];
  const nextIdx = programIdx + 1;
  if(nextIdx < day.exercises.length){
    showProgramExercise(nextIdx);
  } else {
    if(W.exercises.length > 0) endWorkout();
    else showDialog('No exercises logged.',{alert:true,okText:'OK'});
  }
}

async function discardWorkout(){
  const ok = await showDialog('Discard this workout? All data will be lost.', {okText:'Discard'});
  if(!ok) return;
  localStorage.removeItem('iron_active');
  W={active:false,start:null,exercises:[],cur:null,sets:[],setIdx:0,targetSets:3};
  programDay=null; programQueue=[]; programIdx=0;
  document.getElementById('exCard').style.display='none';
  document.getElementById('logView').innerHTML='';
  document.getElementById('timer').textContent='00:00';
  clearRest();
  if(timerInt)clearInterval(timerInt);
  document.getElementById('bottomBar').innerHTML='';
  showPlanView();
}

let _endingWorkout = false; // flag to suppress program auto-advance during endWorkout
async function endWorkout(){
  if(W.exercises.length===0 && (!W.cur || W.sets.length===0)){ showDialog('No exercises logged yet.',{alert:true,okText:'OK'}); return; }
  _endingWorkout = true;
  if(W.cur){
    if(W.sets.length===0){
      // Active exercise with no logged sets — discard it silently
      W.cur=null; W.sets=[]; W.setIdx=0;
      document.getElementById('exCard').style.display='none';
    } else {
      finishExercise();
    }
  }
  _endingWorkout = false;
  // v0.3: single-tap finish + confirm. Replaces the old Finish→Modal→Save two-step.
  const exCount = W.exercises.length;
  const setCount = W.exercises.reduce((s,e)=>s+(e.allSets||[]).length,0);
  const ok = await showDialog(
    `Save and end workout?\n${exCount} exercise${exCount===1?'':'s'}, ${setCount} set${setCount===1?'':'s'}.`,
    {okText:'Save', cancelText:'Keep going', green:true}
  );
  if(!ok) return;
  showSummary();      // populate the summary modal (reads from W, must run before W is cleared)
  submitWorkout();    // persist locally, sync to portal, clear W. Modal stays open as read-only confirmation.
}

function selectExercise(name, weightStr){

      W.cur=null; W.sets=[]; W.setIdx=0;

    }
  }

  const lastSets = hasHistory ? h.sets : [];

  W.setIdx = 0;

    row.innerHTML=`
      <span class="set-label" id="sLbl${i}">Set ${i+1}</span>
      <input class="w-input" id="sW${i}" type="number" inputmode="decimal" placeholder="lbs" value="${sugW}" onfocus="this.select()">

      <button style="width:28px;height:28px;border-radius:6px;background:none;border:1px solid var(--border);color:var(--muted);font-size:12px;display:flex;align-items:center;justify-content:center" onclick="deleteSet(${i})">×</button>`;
    container.appendChild(row);
  }
  // Focus first empty field: weight first, then reps, then reps of set 1 for returning exercises
  setTimeout(()=>{
    const w0=document.getElementById('sW0');
    const r0=document.getElementById('sR0');
    if(w0&&!w0.value) w0.focus();
    else if(r0&&!r0.value) r0.focus();
    else if(r0) r0.focus(); // returning exercise — all pre-filled, focus reps so user can start logging
  },100);

}

function logSet(idx){
  // Guard: don't double-log an already-checked set
  const chk=document.getElementById('sC'+idx);
  if(chk && chk.classList.contains('checked')) return;

  const wEl=document.getElementById('sW'+idx);
  const rEl=document.getElementById('sR'+idx);
  const w=parseFloat(wEl.value);
  const r=parseInt(rEl.value);
  if(isNaN(w)||w<0||!r)return; // allow weight=0 for bodyweight exercises

  W.sets.push({weight:w, reps:r});
  W.setIdx=idx+1;

  // Mark done
  const row=document.getElementById('setRow'+idx);
  row.classList.remove('current');
  row.classList.add('done');
  document.getElementById('sLbl'+idx).classList.add('done-label');
  document.getElementById('sLbl'+idx).textContent='✓ Set '+(idx+1);
  document.getElementById('sC'+idx).classList.add('checked');
  wEl.readOnly=true; rEl.readOnly=true;
  wEl.style.opacity='.5'; rEl.style.opacity='.5';

  // Vibrate
  if(navigator.vibrate) navigator.vibrate(50);

  // Auto-fill next set weight
  if(idx+1 < W.targetSets){
    const nextW=document.getElementById('sW'+(idx+1));
    if(nextW&&!nextW.value) nextW.value=w;
    const nextRow=document.getElementById('setRow'+(idx+1));
    if(nextRow) nextRow.classList.add('current');
    setTimeout(()=>{
      const nextR=document.getElementById('sR'+(idx+1));
      if(nextR) nextR.focus();
    },100);
  }

  // Start rest timer (keep running even on last set — user may need rest before next exercise)
  startRest(restDuration);
  save();
}

function finishExercise(){
  if(!W.cur) return;
  if(W.sets.length===0){ showDialog('Log at least one set first.',{alert:true,okText:'OK'}); return; }
  const name=W.cur;
  const mainWeight = W.sets[0].weight;
  const reps = W.sets.map(s=>s.reps);
  const desc = mainWeight+' lbs';

  // Snapshot previous history for progressive overload comparison
  const prevH = (history[name.toLowerCase()] && history[name.toLowerCase()].sets) ?
    {weight:history[name.toLowerCase()].weight, sets:[...history[name.toLowerCase()].sets]} : null;

  W.exercises.push({name, weight:mainWeight, desc, sets:W.sets.map(s=>s.reps), allSets:W.sets, prev:prevH});

  // Save to history (preserve existing category, store per-set data for smart pre-fill)
  const existingCat = (history[name.toLowerCase()] && history[name.toLowerCase()].category) || '';
  history[name.toLowerCase()]={weight:mainWeight, desc, sets:reps, allSets:W.sets.map(s=>({weight:s.weight,reps:s.reps})), date:new Date().toISOString().split('T')[0], category:existingCat};
  SS('iron_history', history);

  // Update recent
  recentEx = [name, ...recentEx.filter(e=>e.toLowerCase()!==name.toLowerCase())].slice(0,8);
  SS('iron_recent', recentEx);

  W.cur=null; W.sets=[]; W.setIdx=0;
  document.getElementById('exCard').style.display='none';
  // Don't clear rest — user may want rest before starting next exercise
  updateLog();

  // Update bottom bar progress count
  if(programDay) updateBottomBar();

  // If endWorkout triggered this, don't navigate — summary will show
  if(_endingWorkout) { /* no-op */ }
  // Program mode: auto-advance to next exercise
  else if(programDay){
    const day = PROGRAM.schedule[programDay];
    const nextIdx = programIdx + 1;
    if(nextIdx < day.exercises.length){
      showProgramExercise(nextIdx);
    } else {
      // All program exercises done
      endWorkout();
    }
  } else if(currentFocus){
    showMuscleGroups(currentFocus);
  } else {
    showPicker();
  }
  save();
}

function deleteSet(idx){
  if(W.targetSets<=1) return;
  W.targetSets--;
  const savedSets = [...W.sets]; // preserve logged sets
  if(idx < savedSets.length) savedSets.splice(idx,1);

  // Rebuild set rows manually (don't call selectExercise — it resets W.sets)
  const name = W.cur;
  const h = history[name.toLowerCase()];
  const hValid = h && h.sets && h.sets.length > 0;
  const container = document.getElementById('setRows');
  container.innerHTML='';

  W.sets = savedSets;
  W.setIdx = savedSets.length;

  for(let i=0;i<W.targetSets;i++){
    const row = document.createElement('div');
    row.className = 'set-row';
    row.id = 'setRow'+i;
    const isLogged = i < savedSets.length;
    const sugW = isLogged ? savedSets[i].weight : (hValid ? h.weight : '');
    const sugR = isLogged ? savedSets[i].reps : (hValid && h.sets[i] ? h.sets[i] : '');

    if(isLogged){
      row.classList.add('done');
      row.innerHTML=`
        <span class="set-label done-label" id="sLbl${i}">✓ Set ${i+1}</span>
        <input class="w-input" id="sW${i}" type="number" inputmode="decimal" value="${sugW}" readonly style="opacity:.5">
        <span class="x-label">×</span>
        <input class="r-input" id="sR${i}" type="number" inputmode="numeric" value="${sugR}" readonly style="opacity:.5">
        <button class="set-check checked" id="sC${i}" onclick="logSet(${i})">✓</button>
        <button style="width:28px;height:28px;border-radius:6px;background:none;border:1px solid var(--border);color:var(--muted);font-size:12px;display:flex;align-items:center;justify-content:center" onclick="deleteSet(${i})">×</button>`;
    } else {
      if(i === W.setIdx) row.classList.add('current');
      row.innerHTML=`
        <span class="set-label" id="sLbl${i}">Set ${i+1}</span>
        <input class="w-input" id="sW${i}" type="number" inputmode="decimal" placeholder="lbs" value="${sugW}" onfocus="this.select()">
        <span class="x-label">×</span>
        <input class="r-input" id="sR${i}" type="number" inputmode="numeric" placeholder="reps" value="${sugR}" onfocus="this.select()">

function addFromInput(){
  const input=document.getElementById('exInput');
  let val=input.value.trim();
  if(!val)return;
  val=val.replace(/\b\w/g,c=>c.toUpperCase());
  if(!W.active) startWorkout();

  // Save muscle group category from placeholder context
  const placeholder = input.placeholder;
  const category = placeholder.replace(' exercise...','');
  const allGroups = Object.values(MUSCLE_GROUPS).flatMap(c=>c.groups);
  const isValidGroup = allGroups.some(g=>g.toLowerCase()===category.toLowerCase());
  const bestCategory = isValidGroup ? category : (currentFocus || '');

  // If new exercise with no category and no focus, prompt for muscle group
  const existingCat = history[val.toLowerCase()] && history[val.toLowerCase()].category;
  if(!bestCategory && !existingCat){
    showGroupPrompt(val);
    input.value='';
    return;
  }

  if(bestCategory && !existingCat){
    history[val.toLowerCase()] = history[val.toLowerCase()] || {};
    history[val.toLowerCase()].category = bestCategory;
    SS('iron_history', history);
  }

  selectExercise(val);
  input.value='';
}

function showGroupPrompt(exerciseName){
  const prompt = document.getElementById('groupPrompt');
  const pills = document.getElementById('groupPills');
  pills.innerHTML='';
  const allGroups = Object.values(MUSCLE_GROUPS).flatMap(c=>c.groups);
  const unique = [...new Set(allGroups)];
  unique.forEach(group=>{
    const btn=document.createElement('button');
    btn.className='pill';
    btn.textContent=group;
    btn.onclick=()=>{
      history[exerciseName.toLowerCase()] = history[exerciseName.toLowerCase()] || {};

      SS('iron_history', history);
      prompt.classList.remove('show');

  prompt.classList.add('show');
}

// ===================== REST TIMER (from Strong) =====================
let restDuration = 90; // default 90 seconds
const restOptions = [60, 90, 120, 180];

function cycleRestTime(){
  const curIdx = restOptions.indexOf(restDuration);
  restDuration = restOptions[(curIdx+1)%restOptions.length];
  if(restInterval) startRest(restDuration); // restart with new duration
  else{
    const m=Math.floor(restDuration/60);
    const s=(restDuration%60).toString().padStart(2,'0');
    document.getElementById('restTime').textContent=m+':'+s;
  }
}

function startRest(secs){
  secs = secs || restDuration;
  clearRest();
  let rem=secs;
  const bar=document.getElementById('restBar');
  bar.classList.add('show');
  updateRestDisplay(rem);
  restInterval=setInterval(()=>{
    rem--;
    if(rem<=0){clearRest();notifyRestDone()}
    else updateRestDisplay(rem);
  },1000);
}
function clearRest(){
  if(restInterval)clearInterval(restInterval);
  restInterval=null;
  document.getElementById('restBar').classList.remove('show');
}
function updateRestDisplay(s){
  const m=Math.floor(s/60);
  const sec=(s%60).toString().padStart(2,'0');
  document.getElementById('restTime').textContent=m+':'+sec;
}

function notifyRestDone(){
  // Vibrate if supported (Android)
  if(navigator.vibrate) navigator.vibrate([100,50,100]);
  // Audio beep fallback (iOS — no vibration API)
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const osc=ctx.createOscillator();
    const gain=ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.value=880; gain.gain.value=0.3;
    osc.start(); osc.stop(ctx.currentTime+0.15);
    setTimeout(()=>{
      const osc2=ctx.createOscillator();
      const gain2=ctx.createGain();
      osc2.connect(gain2); gain2.connect(ctx.destination);
      osc2.frequency.value=1100; gain2.gain.value=0.3;
      osc2.start(); osc2.stop(ctx.currentTime+0.15);
    },200);
  }catch(e){}
}

// ===================== SUMMARY (from Hevy) =====================
function showSummary(){
  const dur=Math.floor((new Date()-W.start)/60000);
  const totalSets=W.exercises.reduce((s,e)=>s+e.sets.length,0);
  const totalVol=calcVolume(W.exercises);
  let html='';
  if(programDay && PROGRAM.schedule[programDay]){
    const day = PROGRAM.schedule[programDay];
    html+=`<div class="row"><span class="lbl">Program</span><span class="val">${day.label} — ${day.sub}</span></div>`;
  }
  html+=`<div class="row"><span class="lbl">Duration</span><span class="val">${dur} min</span></div>`;
  html+=`<div class="row"><span class="lbl">Exercises</span><span class="val">${W.exercises.length}</span></div>`;
  html+=`<div class="row"><span class="lbl">Total Sets</span><span class="val">${totalSets}</span></div>`;
  html+=`<div class="row"><span class="lbl">Volume</span><span class="val">${totalVol.toLocaleString()} lbs</span></div>`;
  html+='<div style="height:12px"></div>';
  W.exercises.forEach(ex=>{
    const sStr=ex.allSets.map(s=>fmtSet(s)).join(', ');
    // Progressive overload comparison
    const prev=ex.prev;
    let badge='';
    if(prev && prev.sets){
      const prevVol=prev.allSets
        ? prev.allSets.reduce((a,s)=>a+s.weight*s.reps,0)
        : prev.weight * prev.sets.reduce((a,r)=>a+r,0);
      const curVol=ex.allSets.reduce((a,s)=>a+s.weight*s.reps,0);
      const wDiff=ex.weight-prev.weight;
      if(wDiff>0) badge=`<span style="color:var(--green);font-size:11px;font-weight:700"> ↑${wDiff}lbs</span>`;
      else if(wDiff<0) badge=`<span style="color:var(--red);font-size:11px;font-weight:700"> ↓${Math.abs(wDiff)}lbs</span>`;
      else {
        // Same weight — compare total reps
        const prevReps=prev.sets.reduce((a,r)=>a+r,0);
        const curReps=ex.sets.reduce((a,r)=>a+r,0);
        if(curReps>prevReps) badge=`<span style="color:var(--green);font-size:11px;font-weight:700"> +${curReps-prevReps}reps</span>`;
        else if(curReps<prevReps) badge=`<span style="color:var(--red);font-size:11px;font-weight:700"> -${prevReps-curReps}reps</span>`;
        else badge=`<span style="color:var(--dim);font-size:11px"> →same</span>`;
      }
    } else {
      badge=`<span style="color:var(--blue);font-size:11px"> NEW</span>`;
    }
    html+=`<div class="row"><span class="lbl">${ex.name}${badge}</span><span class="val">${sStr}</span></div>`;
  });
  document.getElementById('summaryBody').innerHTML=html;
  document.getElementById('summaryModal').classList.add('show');
}

function submitWorkout(){
  // Save completed workout (cap at 100)
  const startDate = W.start instanceof Date ? W.start : new Date(W.start);
  const dur=Math.floor((new Date()-startDate)/60000);
  const totalVol=calcVolume(W.exercises);
  const totalSets=W.exercises.reduce((s,e)=>s+(e.allSets||[]).length,0);
  let done=LS('iron_completed')||[];
  done.push({date:startDate.toISOString(),dur,exercises:W.exercises,volume:totalVol});
  if(done.length>100) done=done.slice(-100);
  SS('iron_completed',done);
  localStorage.removeItem('iron_active');

  // Edge Function write: complete_session — queued for offline-tolerant sync.
  // exercise/set logs are deferred — session-level totals are enough for trainer MVP.
  // iron_session_id cleanup is handled inside flushQueue on confirmed success.
  if(window.IRON_TOKEN){
    const sessionId = localStorage.getItem('iron_session_id');
    // If sessionId is missing, a pending start_session may still be queued;
    // enqueueSync attaches _awaitingSessionId so flushQueue holds this entry
    // until the start_session drains and provides the real id.
    pwaSync('complete_session', {
      session_id: sessionId || null,
      completed_at: new Date().toISOString(),
      duration_sec: dur * 60,
      total_sets: totalSets,
      total_volume_lbs: totalVol
    }).catch(e => console.warn('[Iron] complete_session enqueue failed', e));
  }

  // v0.3: portal sync above is the system of record. Summary modal stays open until user taps DONE.
  // (Was: shareToJoe() + auto-close modal — both removed.)

  // Clear workout state (modal remains visible as read-only saved-confirmation)
  W={active:false,start:null,exercises:[],cur:null,sets:[],setIdx:0,targetSets:3};
  programDay=null; programQueue=[]; programIdx=0;
  document.getElementById('logView').innerHTML='';
  document.getElementById('timer').textContent='00:00';
  clearRest();
  if(timerInt)clearInterval(timerInt);
  document.getElementById('bottomBar').innerHTML='';
  showPlanView();
}

function saveEdit(){
  if(editIdx<0) return;
  const ex = W.exercises[editIdx];
  const oldName = ex.name;

  // Update name
  const newName = document.getElementById('eNameInput').value.trim();
  if(newName) ex.name = newName;

  // Update sets
  ex.allSets.forEach((s,i)=>{
    const w = parseFloat(document.getElementById('eW'+i).value);
    const r = parseInt(document.getElementById('eR'+i).value);
    if(!isNaN(w) && w>=0) s.weight=w;
    if(r) { s.reps=r; ex.sets[i]=r; }
  });
  ex.weight = ex.allSets[0].weight;
  ex.desc = ex.weight+' lbs';

  // Update history (remove old name if renamed)
  if(oldName.toLowerCase()!==ex.name.toLowerCase()){
    delete history[oldName.toLowerCase()];
    recentEx = recentEx.map(e=>e.toLowerCase()===oldName.toLowerCase()?ex.name:e);
    SS('iron_recent', recentEx);
  }
  const editCat = (history[ex.name.toLowerCase()] && history[ex.name.toLowerCase()].category) || '';
  history[ex.name.toLowerCase()]={weight:ex.weight, desc:ex.desc, sets:ex.sets, date:new Date().toISOString().split('T')[0], category:editCat};
  SS('iron_history', history);

  closeEdit();
  updateLog();
  save();
}

  const completed = LS('iron_completed') || [];
  if(completed.length === 0) return null;

  // Build weekly buckets for last 8 weeks
  const now = new Date();
  const weeks = [];
  for(let i=7; i>=0; i--){
    const wStart = new Date(now);
    wStart.setDate(wStart.getDate() - wStart.getDay() - i*7); // Sunday of that week
    wStart.setHours(0,0,0,0);
    const wEnd = new Date(wStart);
    wEnd.setDate(wEnd.getDate() + 7);
    weeks.push({start:wStart, end:wEnd, sessions:0, volume:0, sets:0, dur:0});
  }

  completed.forEach(w=>{
    const d = new Date(w.date);
    for(const wk of weeks){
      if(d >= wk.start && d < wk.end){
        wk.sessions++;
        wk.volume += w.volume || 0;
        wk.sets += (w.exercises||[]).reduce((a,e)=>(a+(e.allSets||e.sets||[]).length),0);
        wk.dur += w.dur || 0;
        break;
      }
    }
  });

  // Current week = last in array, previous = second to last
  const thisWeek = weeks[weeks.length-1];
  const lastWeek = weeks[weeks.length-2];

  // Streak: consecutive weeks (from most recent backward) with at least 1 session
  let streak = 0;
  for(let i=weeks.length-1; i>=0; i--){
    // Skip current week if it has 0 (week still in progress)
    if(i === weeks.length-1 && weeks[i].sessions === 0) continue;
    if(weeks[i].sessions > 0) streak++;
    else break;
  }

  // All-time stats
  const totalWorkouts = completed.length;
  const totalVolume = completed.reduce((a,w)=>a+(w.volume||0),0);
  const avgDur = Math.round(completed.reduce((a,w)=>a+(w.dur||0),0) / totalWorkouts);

  return {weeks, thisWeek, lastWeek, streak, totalWorkouts, totalVolume, avgDur};
}

function deltaTag(cur, prev, unit, invert){
  if(!prev || prev === 0) return '';
  const diff = cur - prev;
  if(diff === 0) return '<div class="dash-delta flat">— same as last week</div>';
  const pct = Math.round(Math.abs(diff) / prev * 100);
  const arrow = diff > 0 ? '↑' : '↓';
  // For most metrics, up is good. invert flips it.
  const isGood = invert ? diff < 0 : diff > 0;
  const cls = isGood ? 'up' : (diff === 0 ? 'flat' : 'down');
  return `<div class="dash-delta ${cls}">${arrow} ${pct}% ${unit ? unit+' ' : ''}vs last week</div>`;
}

function fmtVol(v){
  if(v >= 1000) return Math.round(v/1000) + 'K';
  return v.toString();
}

function svgBarChart(data, opts){
  const w = opts.width || 280;
  const h = opts.height || 120;
  const color = opts.color || '#dc2626';
  const barGap = 6;
  const labelH = 18;
  const topPad = 16;
  const chartH = h - labelH - topPad;
  const maxVal = Math.max(...data.map(d=>d.value), 1);
  const barW = (w - (data.length+1)*barGap) / data.length;

  let svg = `<svg viewBox="0 0 ${w} ${h}" width="100%" style="display:block">`;

  data.forEach((d, i)=>{
    const x = barGap + i * (barW + barGap);
    const barH = (d.value / maxVal) * chartH;
    const y = topPad + chartH - barH;

    // Bar background
    svg += `<rect x="${x}" y="${topPad}" width="${barW}" height="${chartH}" rx="4" fill="#1c1c1c"/>`;
    // Bar fill
    if(d.value > 0){
      svg += `<rect x="${x}" y="${y}" width="${barW}" height="${barH}" rx="4" fill="${color}" opacity="0.85"/>`;
      // Value label
      svg += `<text x="${x + barW/2}" y="${y - 4}" text-anchor="middle" fill="#999" font-size="9" font-weight="600" font-family="DM Sans,sans-serif">${opts.fmtVal ? opts.fmtVal(d.value) : d.value}</text>`;
    }
    // X-axis label
    svg += `<text x="${x + barW/2}" y="${h - 2}" text-anchor="middle" fill="#666" font-size="9" font-family="DM Sans,sans-serif">${d.label}</text>`;
  });

  svg += '</svg>';
  return svg;
}

// ===================== SVG LINE CHART =====================
function svgLineChart(points, opts){
  const w = opts.width || 280;
  const h = opts.height || 100;
  const color = opts.color || '#dc2626';
  const padL = 36, padR = 10, padT = 12, padB = 20;
  const cw = w - padL - padR;
  const ch = h - padT - padB;

  if(points.length < 2){
    return `<svg viewBox="0 0 ${w} ${h}" width="100%" style="display:block">
      <text x="${w/2}" y="${h/2}" text-anchor="middle" fill="#666" font-size="11" font-family="DM Sans,sans-serif">Need 2+ data points</text></svg>`;
  }

  const vals = points.map(p=>p.value);
  const minV = Math.min(...vals);
  const maxV = Math.max(...vals);
  const range = maxV - minV || 1;

  const px = (i) => padL + (i / (points.length-1)) * cw;
  const py = (v) => padT + ch - ((v - minV) / range) * ch;

  let svg = `<svg viewBox="0 0 ${w} ${h}" width="100%" style="display:block">`;

  // Horizontal grid lines (3)
  for(let i=0; i<=2; i++){
    const yy = padT + (ch/2)*i;
    const val = maxV - (range/2)*i;
    svg += `<line x1="${padL}" y1="${yy}" x2="${w-padR}" y2="${yy}" stroke="#2a2a2a" stroke-width="0.5"/>`;
    svg += `<text x="${padL-4}" y="${yy+3}" text-anchor="end" fill="#666" font-size="8" font-family="DM Sans,sans-serif">${opts.fmtVal ? opts.fmtVal(val) : Math.round(val)}</text>`;
  }

  // Area fill
  const polyPts = points.map((p,i)=>`${px(i)},${py(p.value)}`).join(' ');
  svg += `<polygon points="${px(0)},${padT+ch} ${polyPts} ${px(points.length-1)},${padT+ch}" fill="${color}" opacity="0.12"/>`;

  // Line
  svg += `<polyline points="${polyPts}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`;

  // Dots + x-axis labels
  points.forEach((p,i)=>{
    svg += `<circle cx="${px(i)}" cy="${py(p.value)}" r="3.5" fill="${color}" stroke="#0a0a0a" stroke-width="1.5"/>`;
    // Show first, last, and every other label to avoid crowding
    if(i === 0 || i === points.length-1 || points.length <= 6 || i % Math.ceil(points.length/5) === 0){
      svg += `<text x="${px(i)}" y="${h-3}" text-anchor="middle" fill="#666" font-size="8" font-family="DM Sans,sans-serif">${p.label}</text>`;
    }
  });

  svg += '</svg>';
  return svg;
}

// ===================== EXERCISE PROGRESSION =====================
function getExerciseProgression(){
  const completed = LS('iron_completed') || [];
  if(completed.length === 0) return [];

  // Count exercise frequency and collect data points
  const exMap = {};
  completed.forEach(w=>{
    const d = new Date(w.date);
    const dateStr = (d.getMonth()+1)+'/'+d.getDate();
    (w.exercises||[]).forEach(ex=>{
      const key = ex.name.toLowerCase();
      if(!exMap[key]) exMap[key] = {name:ex.name, points:[], count:0};
      exMap[key].count++;
      // Max weight used in this session — handle legacy {weight, sets} and new {allSets} format
      let maxW = (ex.allSets||[]).reduce((m,s)=>Math.max(m,s.weight||0),0);
      if(maxW === 0 && ex.weight) maxW = ex.weight;
      if(maxW > 0){
        exMap[key].points.push({date:w.date, label:dateStr, value:maxW});
      }
    });
  });

  // Sort by frequency, take top 5 with 3+ data points
  return Object.values(exMap)
    .filter(e=>e.points.length >= 3)
    .sort((a,b)=>b.count - a.count)
    .slice(0,5)
    .map(e=>{
      // Sort points by date
      e.points.sort((a,b)=>new Date(a.date)-new Date(b.date));
      // PR
      e.pr = Math.max(...e.points.map(p=>p.value));
      return e;
    });
}

function renderExProgressionSection(){
  const exData = getExerciseProgression();
  if(exData.length === 0) return '';

  let html = `<div class="dash-section">
    <div class="dash-section-hdr"><span class="dash-section-title">Top Lifts — Progression</span></div>`;

  exData.forEach(ex=>{
    const latest = ex.points[ex.points.length-1].value;
    const first = ex.points[0].value;
    const diff = latest - first;
    const diffStr = diff > 0 ? `<span style="color:var(--green)">+${diff} lbs</span>` : diff < 0 ? `<span style="color:var(--red)">${diff} lbs</span>` : '<span style="color:var(--dim)">—</span>';

    html += `<div class="dash-ex-card" onclick="showExDetail('${ex.name.replace(/'/g,"\\'")}')">
      <div style="display:flex;justify-content:space-between;align-items:baseline">
        <div class="dash-ex-name">${ex.name}</div>
        <div style="font-size:11px">${diffStr}</div>
      </div>
      <div class="dash-ex-sub">PR: ${ex.pr} lbs · ${ex.points.length} sessions</div>
      ${svgLineChart(ex.points, {color:'#dc2626', height:80})}
    </div>`;
  });

  html += '</div>';
  return html;
}

// ===================== EXERCISE DETAIL VIEW =====================
function showExDetail(exName){
  const completed = LS('iron_completed') || [];
  const key = exName.toLowerCase();
  const sessions = [];

  completed.forEach(w=>{
    const d = new Date(w.date);
    (w.exercises||[]).forEach(ex=>{
      if(ex.name.toLowerCase() === key){
        const sets = (ex.allSets||[]).length > 0
          ? ex.allSets.map(s=>s.weight+'×'+s.reps).join(', ')
          : (ex.sets||[]).map(r=>ex.weight+'×'+r).join(', ');
        let maxW = (ex.allSets||[]).reduce((m,s)=>Math.max(m,s.weight||0),0);
        if(maxW === 0 && ex.weight) maxW = ex.weight;
        sessions.push({date:w.date, dateStr:d.toLocaleDateString(), sets, maxW});
      }
    });
  });

  sessions.sort((a,b)=>new Date(a.date)-new Date(b.date));
  const pr = Math.max(...sessions.map(s=>s.maxW));
  const points = sessions.map(s=>({date:s.date, label:(new Date(s.date).getMonth()+1)+'/'+(new Date(s.date).getDate()), value:s.maxW}));

  const dv = document.getElementById('dashView');
  let html = `<button class="dash-detail-back" onclick="renderDashCards()">← Dashboard</button>`;
  html += `<div class="dash-title">${exName}</div>`;
  html += `<div class="dash-card">
    <div style="display:flex;justify-content:space-between">
      <div><div class="dash-stat" style="font-size:22px">${pr}</div><div class="dash-stat-label">PR (lbs)</div></div>
      <div><div class="dash-stat" style="font-size:22px">${sessions.length}</div><div class="dash-stat-label">sessions</div></div>
    </div>
  </div>`;

  if(points.length >= 2){
    html += `<div class="dash-card">
      <div class="dash-card-title">Weight Over Time</div>
      ${svgLineChart(points, {color:'#dc2626', height:130})}
    </div>`;
  }

  html += `<div class="dash-card"><div class="dash-card-title">Session History</div>`;
  sessions.slice().reverse().forEach(s=>{
    const isPR = s.maxW === pr;
    html += `<div class="lab-entry">
      <div>
        <div style="font-size:12px;color:var(--text);font-weight:600">${s.dateStr}${isPR ? ' <span style="color:var(--yellow);font-size:10px">★ PR</span>' : ''}</div>
        <div style="font-size:11px;color:var(--dim)">${s.sets}</div>
      </div>
      <div class="lab-val">${s.maxW}<span class="lab-unit">lbs</span></div>
    </div>`;
  });
  html += '</div>';

  dv.innerHTML = html;
}

];

function getLabs(){ return LS('iron_labs') || []; }
function saveLabs(labs){ SS('iron_labs', labs); }

function addLab(entry){
  const labs = getLabs();
  entry.id = 'lab_' + Date.now();
  labs.push(entry);
  if(labs.length > 500) labs.shift();
  saveLabs(labs);
  // v0.4: bodyweight is the input to protein-target computation server-side.
  // When the user logs Body Weight locally, push it up so get_protein_today
  // returns a fresh target on the next dashboard render.
  if(entry.marker === 'Body Weight' && !isNaN(entry.value) && window.IRON_TOKEN){
    enqueueSync('set_current_weight', {
      weight_lbs: Number(entry.value),
      logged_at: new Date(entry.date || Date.now()).toISOString()
    });
    flushQueue();
  }
}

function deleteLab(id){
  const labs = getLabs().filter(l=>l.id !== id);
  saveLabs(labs);
}

function selectBiomarker(el, name, unit){
  document.getElementById('labMarker').value = name;

  document.querySelectorAll('.lab-pill').forEach(p=>p.classList.remove('sel'));

async function submitLabForm(){
  const marker = document.getElementById('labMarker').value.trim();
  const value = parseFloat(document.getElementById('labValue').value);
  const unit = document.getElementById('labUnit').value.trim();
  const date = document.getElementById('labDate').value;
  const notes = document.getElementById('labNotes').value.trim();

  if(!marker){ await showDialog('Enter a biomarker name.',{alert:true,okText:'OK'}); return; }
  if(isNaN(value)){ await showDialog('Enter a numeric value.',{alert:true,okText:'OK'}); return; }

  addLab({date, marker, value, unit, notes});
  renderDashCards();
}

function renderLabSection(){
  const labs = getLabs();

  let html = `<div class="dash-section">
    <div class="dash-section-hdr">
      <span class="dash-section-title">Lab Results</span>
      <button class="dash-add-btn" onclick="showLabForm()">+ Add</button>
    </div>
    <div style="display:flex;align-items:flex-start;gap:8px;background:rgba(234,179,8,.1);border:1px solid rgba(234,179,8,.35);border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:12px;color:#d97706;line-height:1.45">
      <span style="flex-shrink:0;font-size:14px">&#9888;</span>
      <span>Self-reported only. This data is not reviewed by your trainer or any clinician. Share lab values directly with your physician &mdash; don&rsquo;t rely on this view for medical decisions.</span>
    </div>`;

  if(labs.length === 0){
    html += `<div class="dash-card"><div style="text-align:center;color:var(--dim);font-size:13px;padding:12px">No lab results yet. Tap + Add to log bloodwork.</div></div>`;
    html += '</div>';
    return html;
  }

  // Group by marker
  const byMarker = {};
  labs.forEach(l=>{
    if(!byMarker[l.marker]) byMarker[l.marker] = [];
    byMarker[l.marker].push(l);
  });

  // Sort each group by date
  Object.values(byMarker).forEach(arr=>arr.sort((a,b)=>a.date.localeCompare(b.date)));

  // Render a card per biomarker
  Object.entries(byMarker).forEach(([marker, entries])=>{
    const latest = entries[entries.length-1];
    const bio = BIOMARKERS.find(b=>b.name === marker);
    const color = bio ? bio.color : '#999';
    const invert = bio ? bio.invert : false;

    // Trend arrow
    let trendHtml = '';
    if(entries.length >= 2){
      const prev = entries[entries.length-2].value;
      const diff = latest.value - prev;
      if(diff !== 0){
        const arrow = diff > 0 ? '↑' : '↓';
        const isGood = invert ? diff < 0 : diff > 0;
        const cls = isGood ? 'up' : 'down';
        trendHtml = `<span class="dash-delta ${cls}" style="display:inline;margin-left:6px">${arrow}${Math.abs(Math.round(diff*100)/100)}</span>`;
      }
    }

    // Sparkline
    let spark = '';
    if(entries.length >= 2){
      const pts = entries.map((e,i)=>({label:'', value:e.value}));
      spark = svgLineChart(pts, {color, height:50, width:280});
    }

    html += `<div class="dash-ex-card" onclick="showLabDetail('${marker.replace(/'/g,"\\'")}')">
      <div style="display:flex;justify-content:space-between;align-items:baseline">
        <div class="dash-ex-name">${marker}</div>
        <div><span class="lab-val">${latest.value}</span><span class="lab-unit">${latest.unit}</span>${trendHtml}</div>
      </div>
      <div class="dash-ex-sub">${latest.date} · ${entries.length} reading${entries.length>1?'s':''}</div>
      ${spark}
    </div>`;
  });

  html += '</div>';
  return html;
}

function showLabDetail(marker){
  const labs = getLabs().filter(l=>l.marker === marker).sort((a,b)=>a.date.localeCompare(b.date));
  if(labs.length === 0){ renderDashCards(); return; }

  const bio = BIOMARKERS.find(b=>b.name === marker);
  const color = bio ? bio.color : '#999';

// ===================== PROTEIN TRACKING (v0.4) =====================
// Owner-only feature for advanced lifters: per-meal protein logging,
// bodyweight-coupled target (default 1.0 g/lb), 7-day mini-chart, settings.
// Server: pwa-sync actions log_protein / delete_protein / get_protein_today /
//         set_protein_coefficient / set_current_weight.
// Sync: routes through enqueueSync — same offline-tolerant queue as workouts.
// Idempotency: every log_protein carries a client_log_id so flushQueue replays
//              don't double-insert.

const PROTEIN_LOCAL_KEY     = 'iron_protein_local';   // optimistic / offline cache of today's logs
const PROTEIN_TODAY_KEY     = 'iron_protein_today';   // server snapshot from get_protein_today
const PROTEIN_HISTORY_KEY   = 'iron_protein_history'; // last 7 days of totals (for mini-chart)
const PROTEIN_COEF_KEY      = 'iron_protein_coef';    // local copy of coefficient, mirrors server
const PROTEIN_OVERRIDE_KEY  = 'iron_protein_override';// local copy of override grams (or null)

const MEAL_LABELS = ['breakfast','lunch','dinner','snack','pre-workout','post-workout','other'];

function getProteinLocal(){ return LS(PROTEIN_LOCAL_KEY) || []; }
function saveProteinLocal(arr){ SS(PROTEIN_LOCAL_KEY, arr); }
function getProteinSnapshot(){ return LS(PROTEIN_TODAY_KEY) || null; }
function saveProteinSnapshot(s){ SS(PROTEIN_TODAY_KEY, s); }
function getProteinHistory(){ return LS(PROTEIN_HISTORY_KEY) || []; }
function saveProteinHistory(h){ SS(PROTEIN_HISTORY_KEY, h); }

function getProteinCoef(){
  const v = LS(PROTEIN_COEF_KEY);
  return (typeof v === 'number' && v >= 0.5 && v <= 2.0) ? v : 1.0;
}
function getProteinOverride(){
  const v = LS(PROTEIN_OVERRIDE_KEY);
  return (typeof v === 'number' && v > 0) ? v : null;
}

// Compute target locally as a fallback (offline / before first server response).
function computeLocalTarget(){
  const ovr = getProteinOverride();
  if(ovr != null) return ovr;
  const labs = getLabs().filter(l => l.marker === 'Body Weight');
  if(labs.length === 0) return null;
  labs.sort((a,b) => a.date.localeCompare(b.date));
  const w = Number(labs[labs.length-1].value);
  if(!w) return null;
  return Math.round(w * getProteinCoef());
}

// Today's combined view: server logs (authoritative IDs) merged with optimistic
// local entries that haven't been confirmed yet (matched by client_log_id).
function getProteinTodayCombined(){
  const snap = getProteinSnapshot();
  const serverLogs = (snap && snap.logs) ? snap.logs.slice() : [];
  const serverIds = new Set(serverLogs.map(l => l.client_log_id).filter(Boolean));
  const local = getProteinLocal().filter(l => !serverIds.has(l.client_log_id));
  const merged = serverLogs.concat(local);
  merged.sort((a,b) => (a.logged_at || '').localeCompare(b.logged_at || ''));
  const total = merged.reduce((s, r) => s + Number(r.grams || 0), 0);
  const target = (snap && snap.target_grams != null) ? snap.target_grams : computeLocalTarget();
  return { logs: merged, total_grams: total, target_grams: target };
}

async function refreshProteinToday(){
  if(!window.IRON_TOKEN) return;
  try {
    const data = await _rawPwaSync('get_protein_today', {});
    saveProteinSnapshot(data);
    // Drop any optimistic local entries that the server now reports back.
    const serverIds = new Set((data.logs || []).map(l => l.client_log_id).filter(Boolean));
    const remaining = getProteinLocal().filter(l => !serverIds.has(l.client_log_id));
    saveProteinLocal(remaining);
    // Append today's total to the rolling 7-day history (today's row is replaced each call).
    const todayKey = new Date().toISOString().slice(0,10);
    const hist = getProteinHistory().filter(h => h.date !== todayKey);
    hist.push({date: todayKey, total: data.total_grams || 0, target: data.target_grams || 0});
    while(hist.length > 7) hist.shift();
    saveProteinHistory(hist);
    updateProteinNavBadge();
  } catch(e){
    console.warn('[Iron] refreshProteinToday failed', e);
  }
}

// Header nav button shows current protein progress so it's visible from every view
// (planView default landing doesn't render the protein section; this keeps progress
// glanceable without forcing a Stats tap).
function updateProteinNavBadge(){
  const btn = document.getElementById('navProtein');
  if(!btn) return;
  const snap = getProteinSnapshot();
  if(!snap){ btn.textContent = 'Protein'; return; }
  // Include any optimistic local entries not yet drained from the queue.
  const localTotal = (getProteinLocal() || []).reduce((s, l) => s + Number(l.grams || 0), 0);
  const total = Math.round((Number(snap.total_grams) || 0) + localTotal);
  const target = snap.target_grams ? Math.round(Number(snap.target_grams)) : null;
  btn.textContent = target ? `Protein ${total}/${target}g` : `Protein ${total}g`;
}

function selectMealLabel(el, label){
  document.getElementById('proteinMeal').value = label;
  document.querySelectorAll('.lab-pill').forEach(p => p.classList.remove('sel'));

}

async function submitProteinForm(){
  const grams = parseFloat(document.getElementById('proteinGrams').value);
  const meal  = document.getElementById('proteinMeal').value.trim();
  const time  = document.getElementById('proteinTime').value;
  if(isNaN(grams) || grams <= 0){
    await showDialog('Enter grams of protein.', {alert:true, okText:'OK'}); return;
  }
  // Build logged_at from today + chosen time
  let loggedAt = new Date();
  if(time){
    const [h, m] = time.split(':').map(Number);
    loggedAt.setHours(h, m, 0, 0);
  }
  const client_log_id = 'cl_' + Date.now() + '_' + Math.random().toString(36).slice(2,7);
  // Optimistic local entry — gets cleared on next refreshProteinToday once server echoes it back.
  const localEntry = {
    id: client_log_id,                   // temporary id for delete affordance pre-sync
    client_log_id,
    grams,
    meal_label: meal || null,
    logged_at: loggedAt.toISOString(),
    _pending: true
  };
  const arr = getProteinLocal();
  arr.push(localEntry);
  saveProteinLocal(arr);

  enqueueSync('log_protein', {
    grams,
    meal_label: meal || null,
    logged_at: loggedAt.toISOString(),
    client_log_id
  });
  await flushQueue();
  await refreshProteinToday();
  renderDashCards();
}

async function deleteProteinLog(logId, clientLogId, isPending){
  const ok = await showDialog('Delete this protein log?', {okText:'Delete', cancelText:'Cancel'});
  if(!ok) return;
  if(isPending){
    // Pure local entry — never made it to server. Drop locally.
    saveProteinLocal(getProteinLocal().filter(l => l.client_log_id !== clientLogId));
  } else {
    enqueueSync('delete_protein', {log_id: logId});
    await flushQueue();
  }
  await refreshProteinToday();
  renderDashCards();
}

  document.getElementById('coefCard').style.display = (mode === 'coef') ? '' : 'none';

async function saveProteinSettings(){
  const mode = document.querySelector('input[name="pmode"]:checked').value;
  if(mode === 'coef'){
    const c = parseFloat(document.getElementById('coefSlider').value);
    SS(PROTEIN_COEF_KEY, c);
    SS(PROTEIN_OVERRIDE_KEY, null);
    enqueueSync('set_protein_coefficient', {coefficient: c, override_grams: null});
  } else {
    const g = parseFloat(document.getElementById('ovrInput').value);
    if(isNaN(g) || g <= 0){
      await showDialog('Enter a daily protein target in grams.', {alert:true, okText:'OK'}); return;
    }
    SS(PROTEIN_OVERRIDE_KEY, g);
    enqueueSync('set_protein_coefficient', {override_grams: g});
  }
  await flushQueue();
  await refreshProteinToday();
  renderDashCards();
}

function fmtTime(iso){
  const d = new Date(iso);
  let h = d.getHours();
  const m = String(d.getMinutes()).padStart(2,'0');
  const ap = h >= 12 ? 'p' : 'a';
  h = h % 12; if(h === 0) h = 12;
  return h + ':' + m + ap;
}

function renderProteinSection(){
  const {logs, total_grams, target_grams} = getProteinTodayCombined();
  const hasTarget = target_grams != null && target_grams > 0;
  const pct = hasTarget ? Math.min(100, Math.round((total_grams / target_grams) * 100)) : 0;

  let html = `<div class="dash-section">
    <div class="dash-section-hdr">
      <span class="dash-section-title">Protein</span>
      <div style="display:flex;gap:6px">
        <button class="dash-add-btn" onclick="showProteinSettings()" aria-label="Settings" style="padding:4px 8px">⚙</button>
        <button class="dash-add-btn" onclick="showProteinModal()">+ Add</button>
      </div>
    </div>`;

  // Today summary card
  html += `<div class="dash-card">
    <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px">
      <div>
        <span style="font-size:24px;font-weight:900;color:var(--text)">${Math.round(total_grams)}g</span>
        <span style="font-size:13px;color:var(--dim);margin-left:4px">${hasTarget ? '/ '+Math.round(target_grams)+'g target' : '— set a target in ⚙'}</span>
      </div>
      ${hasTarget ? `<div style="font-size:13px;color:${pct>=90?'var(--green)':'var(--dim)'};font-weight:700">${pct}%</div>` : ''}
    </div>`;
  if(hasTarget){
    html += `<div style="height:8px;background:var(--s2);border-radius:4px;overflow:hidden">
      <div style="height:100%;width:${pct}%;background:var(--red);transition:width 0.3s ease"></div>
    </div>`;
  }
  html += `</div>`;

  // Today's log list
  if(logs.length === 0){
    html += `<div class="dash-card"><div style="text-align:center;color:var(--dim);font-size:13px;padding:8px">No meals logged today.</div></div>`;
  } else {
    html += `<div class="dash-card">`;
    logs.forEach(l => {
      const lbl = l.meal_label ? l.meal_label : 'meal';
      const pending = l._pending ? ' <span style="font-size:10px;color:var(--muted)">(syncing)</span>' : '';
      html += `<div class="lab-entry">
        <div>
          <div style="font-size:14px;font-weight:600;color:var(--text);text-transform:capitalize">${escapeHtml(lbl)}${pending}</div>
          <div class="lab-date">${fmtTime(l.logged_at)}</div>
        </div>
        <div style="display:flex;align-items:center;gap:8px">
          <span class="lab-val">${Math.round(l.grams)}g</span>
          <button class="lab-del" onclick="deleteProteinLog('${l.id||''}','${l.client_log_id||''}',${!!l._pending})">Delete</button>
        </div>
      </div>`;
    });
    html += `</div>`;
  }

  // 7-day mini chart (CSS bars, no library)
  const hist = getProteinHistory();
  if(hist.length >= 2){
    const max = Math.max(...hist.map(h => Math.max(h.total||0, h.target||0)), 1);
    html += `<div class="dash-card">
      <div class="dash-card-title">Last 7 days</div>
      <div style="display:flex;align-items:flex-end;gap:4px;height:80px;margin-top:8px">`;
    hist.forEach(h => {
      const totalH = (h.total / max) * 70;
      const targetH = h.target ? (h.target / max) * 70 : 0;
      const day = new Date(h.date);
      const dl = ['S','M','T','W','T','F','S'][day.getDay()];
      const hit = h.target && h.total >= h.target * 0.9;
      html += `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px">
        <div style="width:100%;height:70px;display:flex;align-items:flex-end;position:relative">
          <div style="width:100%;height:${totalH}px;background:${hit?'var(--green)':'var(--red)'};border-radius:2px 2px 0 0"></div>
          ${targetH ? `<div style="position:absolute;bottom:${targetH}px;left:0;right:0;height:1px;background:var(--dim);opacity:.6"></div>` : ''}
        </div>
        <div style="font-size:9px;color:var(--muted)">${dl}</div>
      </div>`;
    });
    html += `</div></div>`;
  }

  html += `</div>`;
  return html;
}

// Minimal HTML escape used by protein meal labels (free text).
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => (
    {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]
  ));
}

// Override renderDashCards to include Phase 2+3 sections + Protein (v0.4)
const _renderDashPhase1 = renderDashCards;
renderDashCards = function(){
  _renderDashPhase1();
  const dv = document.getElementById('dashView');
  const data = getDashData();

  // Lab Results + Protein render independently of workout history (different data paths).
  // Only ExProgression depends on getDashData() (it's a workout-history visualization).
  let extra = '';
  if(data){
    extra += renderExProgressionSection();
  }
  extra += renderLabSection();
  extra += renderProteinSection();
  dv.innerHTML += extra;

  // Refresh server snapshot on every dashboard open (fire-and-forget, then re-render once).
  if(window.IRON_TOKEN){
    refreshProteinToday().then(() => {
      // Only re-render if the dashboard is still showing
      const dv2 = document.getElementById('dashView');
      if(dv2 && dv2.style.display !== 'none'){
        // Avoid render storm: only re-render the protein chunk if totals changed.
        // Cheap check: re-render unconditionally (small DOM, infrequent trigger).
        _renderDashPhase1();
        let e2 = '';
        const d2 = getDashData();
        if(d2){ e2 += renderExProgressionSection(); }
        e2 += renderLabSection();
        e2 += renderProteinSection();
        dv2.innerHTML += e2;
      }
    });
  }
};

let timerInt=null;

  timerInt=setInterval(()=>{
    if(!W.start)return;
    const s=Math.floor((new Date()-new Date(W.start))/1000);
    const m=Math.floor(s/60).toString().padStart(2,'0');
    const sec=(s%60).toString().padStart(2,'0');

// ===================== RESTORE UI =====================
function restoreUI(){
  startTimer();
  document.getElementById('planView').style.display='none';
  document.getElementById('dashView').style.display='none';

  // Restore program state if applicable
  if(W.programDay && PROGRAM.schedule[W.programDay]){
    programDay = W.programDay;
    programIdx = W.programIdx || 0;
  }

  updateBottomBar();
  updateLog();
  if(W.cur){
    if(programDay) restoreProgramExerciseCard();
    else restoreExerciseCard();
  }
